name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy midway; superseded pull-request checks are fair game.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, format & build
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.version.outputs.should-deploy }}
      version: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # yarn.lock is not committed, so there is nothing to freeze the install
      # against and nothing for setup-node's cache to key on. Dependency
      # versions are therefore resolved fresh on every run.
      - run: yarn install

      - run: yarn lint

      - run: yarn format:check

      # Fails if README.md's generated regions have drifted — from a rate-year
      # bump, or simply from the calendar rolling over. Fix with
      # `yarn sync:readme` and commit.
      - run: yarn sync:readme:check

      # `yarn build` is `tsc -b && vite build`, so this typechecks too.
      - run: yarn build

      # The built site carries its own version.json. Comparing package.json
      # against the copy already live means a failed or skipped deploy simply
      # leaves the live version behind, and the next run picks it up again.
      - name: Compare version with the live site
        id: version
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          package=$(jq -r '.version' package.json)
          url="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/version.json"

          live=""
          if body=$(curl -fsSL --max-time 30 "$url"); then
            live=$(printf '%s' "$body" | jq -r '.version // empty')
          fi

          if [ -z "$live" ]; then
            live="0.0.0"
            echo "No version.json live yet — treating the site as $live."
          fi

          if [ "$package" = "$live" ]; then
            should=false
            reason="unchanged from the live site"
          elif [ "$(printf '%s\n%s\n' "$package" "$live" | sort -V | tail -n1)" = "$package" ]; then
            should=true
            reason="newer than the live site"
          else
            should=false
            reason="older than the live site"
          fi

          echo "should-deploy=$should" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

          {
            echo "| | Version |"
            echo "| --- | --- |"
            echo "| package.json | \`$package\` |"
            echo "| Live site | \`$live\` |"
            echo ""
            if [ "$should" = true ]; then
              echo "Deploying — package.json is $reason."
            else
              echo "Skipping deploy — package.json is $reason. Bump the version to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.version.outputs.should-deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy v${{ needs.verify.outputs.version }} to GitHub Pages
    needs: verify
    if: needs.verify.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
